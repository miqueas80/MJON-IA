[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mjon-ia"
version = "0.5.0"
description = "Modelo Transformer independiente entrenado desde cero"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["torch>=2.2,<3"]

[tool.setuptools.packages.find]
where = ["src"]
