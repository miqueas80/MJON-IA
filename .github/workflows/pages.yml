name: Publicar MJON IA en GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - 'docs/**'
      - 'src/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - 'data/demo.txt'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar PyTorch CPU
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . --no-deps
      - name: Ejecutar pruebas de regresión
        run: python -m unittest discover -s tests -v
      - name: Entrenar y exportar v0.1 y v0.2
        run: python scripts/build_web_models.py
      - name: Crear corpus sintético propio para v0.3
        run: python -m mjon_ia.synthetic --output data/synthetic_es.txt --examples 1800 --seed 42
      - name: Entrenar tercer modelo con BPE propio (500K)
        run: |
          python -m mjon_ia.train_v03 --data data/synthetic_es.txt --out checkpoints/web/v03.pt --steps 500 --eval-every 100 --save-every 100 --context 96 --vocab-size 512 --d-model 96 --layers 4 --heads 4 --batch-size 4 --grad-accum 2 --lr 0.0006 --dropout 0 --device cpu --cpu-threads 2
      - name: Publicar pesos del tercer modelo
        run: |
          python scripts/export_web.py --checkpoint checkpoints/web/v03.pt --out docs/web/weights-v03.txt
          python scripts/catalog_v03.py --checkpoint checkpoints/web/v03.pt --weights docs/web/weights-v03.txt --catalog docs/web/models.json
      - name: Corpus Forge v0.4 · datos y evaluación aislados
        run: python -m mjon_ia.corpus_forge --corpus data/corpus_v04.txt --probes data/benchmark_v04.json --examples 5000 --seed 2026
      - name: Entrenar v0.4 · 1,27 millones de parámetros
        run: |
          python -m mjon_ia.train_v03 --data data/corpus_v04.txt --out checkpoints/web/v04.pt --steps 1000 --eval-every 250 --save-every 250 --context 128 --vocab-size 512 --tokenizer-chars 80000 --d-model 128 --layers 6 --heads 4 --batch-size 4 --grad-accum 2 --lr 0.0006 --dropout 0 --device cpu --cpu-threads 2
      - name: Exportar modelo v0.4
        run: |
          python scripts/export_web.py --checkpoint checkpoints/web/v04.pt --out docs/web/weights-v04.txt
          python scripts/catalog_v04.py --checkpoint checkpoints/web/v04.pt --weights docs/web/weights-v04.txt --catalog docs/web/models.json
      - name: Ejecutar MJON Bench con preguntas no entrenadas
        run: python scripts/evaluate_v04.py --benchmark data/benchmark_v04.json --checkpoints checkpoints/web/v03.pt checkpoints/web/v04.pt --out docs/web/benchmarks.json --limit 12
      - name: Generar instrucciones v0.5 y ejemplos reservados
        run: python -m mjon_ia.instruction_v05 --out data/instruction_v05
      - name: Ajustar v0.5 con respuestas supervisadas
        run: |
          python -m mjon_ia.finetune_v05 --base checkpoints/web/v04.pt --train data/instruction_v05/train.json --holdout data/instruction_v05/holdout.json --out checkpoints/web/v05.pt --steps 900 --eval-every 150 --save-every 150 --batch-size 8 --grad-accum 1 --lr 0.0003 --cpu-threads 2
      - name: Exportar pesos v0.5 y mantener versiones anteriores
        run: |
          python scripts/export_web.py --checkpoint checkpoints/web/v05.pt --out docs/web/weights-v05.txt
          python scripts/catalog_v05.py --checkpoint checkpoints/web/v05.pt --weights docs/web/weights-v05.txt --catalog docs/web/models.json
      - name: Evaluar generación libre contra v0.4
        run: python scripts/benchmark_v05.py --base checkpoints/web/v04.pt --tuned checkpoints/web/v05.pt --holdout data/instruction_v05/holdout.json --out docs/web/firstwords.json --limit 48
      - name: Crear corpus de memoria v0.6 con objetos reservados
        run: python -m mjon_ia.memory_v06 --out data/memory_v06 --seed 606 --limit 2500
      - name: Ajustar v0.6 desde v0.5 y conservar habilidades anteriores
        run: |
          python -m mjon_ia.finetune_v06 --base checkpoints/web/v05.pt --train data/memory_v06/train.json --holdout data/memory_v06/holdout.json --replay data/instruction_v05/train.json --out checkpoints/web/v06.pt --steps 900 --eval-every 150 --save-every 150 --batch-size 8 --lr 0.0002 --replay-fraction 0.2 --cpu-threads 2
      - name: Exportar y catalogar pesos v0.6
        run: |
          python scripts/export_web.py --checkpoint checkpoints/web/v06.pt --out docs/web/weights-v06.txt
          python scripts/catalog_v06.py --checkpoint checkpoints/web/v06.pt --weights docs/web/weights-v06.txt --catalog docs/web/models.json
      - name: Evaluar memoria, correcciones y retención v0.5
        run: |
          python scripts/benchmark_v06.py --base checkpoints/web/v05.pt --tuned checkpoints/web/v06.pt --holdout data/memory_v06/holdout.json --firstwords data/instruction_v05/holdout.json --out docs/web/memory.json --per-group 8
      - name: Crear materias y examen v0.7 independientes
        run: python -m mjon_ia.school_v07 --out data/school_v07 --per-subject 1200 --heldout 32 --seed 707
      - name: Ajustar v0.7 desde v0.6 con contexto ampliado
        run: |
          python -m mjon_ia.train_v07 --base checkpoints/web/v06.pt --train data/school_v07/train.json --holdout data/school_v07/holdout.json --transfer data/school_v07/transfer.json --replay05 data/instruction_v05/train.json --replay06 data/memory_v06/train.json --out checkpoints/web/v07.pt --context 256 --steps 1100 --eval-every 220 --save-every 220 --batch-size 6 --lr 0.0002 --replay-v05 0.12 --replay-v06 0.12 --cpu-threads 2
      - name: Publicar pesos v0.7 y mantener versiones históricas
        run: |
          python scripts/export_web.py --checkpoint checkpoints/web/v07.pt --out docs/web/weights-v07.txt
          python scripts/catalog_v07.py --checkpoint checkpoints/web/v07.pt --weights docs/web/weights-v07.txt --catalog docs/web/models.json
      - name: Rendir MJON Examen y verificar retención
        run: |
          python scripts/benchmark_v07.py --before checkpoints/web/v06.pt --after checkpoints/web/v07.pt --holdout data/school_v07/holdout.json --transfer data/school_v07/transfer.json --memory-holdout data/memory_v06/holdout.json --firstwords data/instruction_v05/holdout.json --out docs/web/school.json --per-subject 10
      - name: Verificar catálogo y archivos de pesos
        run: python scripts/verify_web_models.py
      - name: Verificar inferencia JavaScript en las siete versiones
        run: node scripts/verify_browser.mjs
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Preparar contenido estático
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs
      - name: Publicar Pages
        id: deployment
        uses: actions/deploy-pages@v4
