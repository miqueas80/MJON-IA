name: Publicar MJON IA en GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - 'docs/**'
      - 'src/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - 'data/demo.txt'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar PyTorch CPU
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . --no-deps
      - name: Ejecutar pruebas de regresión
        run: python -m unittest discover -s tests -v
      - name: Entrenar y exportar v0.1 y v0.2
        run: python scripts/build_web_models.py
      - name: Verificar catálogo y archivos de pesos
        run: python scripts/verify_web_models.py
      - name: Verificar inferencia JavaScript en ambas versiones
        run: node scripts/verify_browser.mjs
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Preparar contenido estático
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs
      - name: Publicar Pages
        id: deployment
        uses: actions/deploy-pages@v4
