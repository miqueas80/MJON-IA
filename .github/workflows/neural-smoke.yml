name: MJON Neural Core · pruebas rápidas de escalabilidad

on:
  push:
    branches: [main]
    paths:
      - 'src/mjon_ia/neural_core.py'
      - 'src/mjon_ia/scalable_train.py'
      - 'tests/test_neural_core.py'
      - '.github/workflows/neural-smoke.yml'
      - 'pyproject.toml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-neural-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias mínimas para la prueba
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install sentencepiece
          python -m pip install -e . --no-deps
      - name: Validar la nueva arquitectura y entrenar realmente en CPU
        run: python -m unittest discover -s tests -p 'test_neural_core.py' -v
